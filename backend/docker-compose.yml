services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitfrost_dev
      POSTGRES_USER: bitfrost_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bitfrost_dev -d bitfrost_dev']
      interval: 2s
      timeout: 5s
      retries: 20
  db_test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: bitfrost_test
      POSTGRES_USER: bitfrost_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bitfrost_test -d bitfrost_test']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-dev-data:
